name: Basic CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-and-sanity-check:
    name: Code Quality & Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          # Check syntax errors, unused variables, and redundant imports
          ruff check .

      - name: Run basic tests (if any)
        run: |
          # Run tests if tests directory exists to avoid failures before tests are added
          if [ -d "tests" ]; then pytest tests/; else echo "No tests directory found yet. Skipping."; fi
