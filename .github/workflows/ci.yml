name: Basic CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  frontend:
    name: Frontend tests, build and browser checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  lint-and-sanity-check:
    name: Code Quality & Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          # Check syntax errors, unused variables, and redundant imports
          ruff check .

      - name: Run basic tests (if any)
        run: |
          # Run tests if tests directory exists to avoid failures before tests are added
          if [ -d "tests" ]; then pytest tests/; else echo "No tests directory found yet. Skipping."; fi

      - name: Scan for committed secrets
        run: python dev.py db scan-secrets

      - name: Validate benchmark file
        run: python dev.py ai benchmark validate

      - name: Check branch name (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python dev.py devops branch "$HEAD_REF"

  postgres-integration:
    name: PostgreSQL backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pathly
          POSTGRES_PASSWORD: pathly-test-only
          POSTGRES_DB: pathly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathly -d pathly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PATHLY_TEST_DATABASE_URL: postgresql+psycopg://pathly:pathly-test-only@127.0.0.1:5432/pathly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -e ".[dev,postgres]"
      - run: pytest tests/ -q
