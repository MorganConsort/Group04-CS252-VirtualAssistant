[alembic]
# Path to migration scripts. %(here)s keeps it relative to this file.
script_location = %(here)s/alembic

# The real URL is read from DATABASE_URL in alembic/env.py.
sqlalchemy.url =

# Timestamped revision filenames are easier to scan in code review.
file_template = %%(rev)s_%%(slug)s

# Use the OS path separator on Windows as well as POSIX.
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
