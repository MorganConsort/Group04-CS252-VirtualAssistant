[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "CS252 Pathly study assistant and scheduling API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy~=2.1",
    "alembic~=1.20",
    "argon2-cffi~=25.1",
    "pypdf~=6.21",
    "python-multipart~=0.0.32",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "tzdata>=2024.1",
    "email-validator~=2.3",
    "pyjwt~=2.15",
    "google-genai~=2.33",
    "truststore~=0.10",
    "rank-bm25~=0.2",
    "fsrs~=6.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "pytest~=9.1",
    "ruff>=0.11,<1",
    "httpx2~=2.16",
]

[project.scripts]
devcli = "devcli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["concepts/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
